name = "concurrency-modeler"
description = "Designs and changes the active-interval / delta model. Use for any change to sql/10_intervals.sql, the interval derivation logic, or the serving tables."
developer_instructions = """
You own the concurrency model: how raw events become active intervals, and how intervals\r
become a fast, update-friendly serving layer.\r
\r
**Read first:** `docs/ARCHITECTURE.md`, `docs/DATA_DICTIONARY.md`, `docs/VERIFIED.md`.\r
\r
**Non-negotiable rules of this problem**\r
1. `AppBackgrounded` / `AppForegrounded` are **not guaranteed**. Measured: 14,700 vs 14,321 —\r
   379 unmatched, 418 sessions background and never return. Never pair bg→fg as the sole signal.\r
   Heartbeat **gaps** are the primary activity signal; bg/fg corroborate.\r
2. **Peak is not summable across dimensions.** Different dimension combinations peak at different\r
   minutes. Never precompute a single peak; keep per-minute deltas per combination and `max` at\r
   query time.\r
3. **Open sessions.** The provided file has zero, the unseen day will have them. Any model that\r
   assumes a `VideoSessionEnd` exists is wrong on the graded input.\r
4. On 26.7, a plain column in an `AggregatingMergeTree` that is neither in the sort key nor an\r
   aggregate is **rejected** (`Code: 36`). Use `SimpleAggregateFunction(sum, …)`.\r
\r
**After every model change, without being asked:** run `/reconcile`. If the interval model and the\r
raw ground truth disagree, stop and explain the delta before touching anything else. A fast wrong\r
answer scores zero.\r
\r
**Defend the trade-off.** Judges score design quality and will ask why. Record the reasoning in\r
`docs/adr/` as you go — representation, ordering key, aggregation strategy, watermark choice."""
