name: go

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch — a hackathon repo pushes often.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to the same version devbox.json installs, so CI and a local
  # `devbox run lint` cannot disagree about what passes.
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  build:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth for the Go version.
          go-version-file: go.mod
          cache: true

      - name: go mod tidy is committed
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: vet
        run: go vet ./...

      - name: install golangci-lint
        # go install, not the marketplace action: the version then comes from
        # one env var shared with devbox.json instead of an action's own matrix.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: lint
        run: golangci-lint run ./...

      - name: test
        # Race detector needs cgo; everything else builds with CGO_ENABLED=0.
        run: CGO_ENABLED=1 go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -20

      - name: build
        run: make build

      - uses: actions/upload-artifact@v4
        with:
          name: sonyliv-linux-amd64
          path: bin/sonyliv
          if-no-files-found: error
